<div id="social-floating">

    <div class="social-links">
        <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">
            <img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="Instagram">
        </a>

        <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">
            <img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt="Facebook">
        </a>

        <a href="https://wa.me/" target="_blank" aria-label="WhatsApp">
            <img src="https://cdn.simpleicons.org/whatsapp/FFFFFF" alt="WhatsApp">
        </a>
    </div>

    <button id="social-toggle" aria-label="Otvori društvene mreže">
        <span id="social-icon">+</span>
    </button>

</div>

<style>
#social-floating {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

#social-floating a,
#social-toggle {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #244b36;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: 0.3s ease;
}

#social-floating a img {
    width: 23px;
    height: 23px;
}

#social-floating a {
    opacity: 0;
    visibility: hidden;
    transform: translateY(15px);
    transition: 0.3s ease;
}

#social-floating.active a {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

#social-floating a:hover,
#social-toggle:hover {
    background: #527b5d;
    transform: scale(1.1);
}

#social-toggle {
    color: white;
    font-size: 32px;
    font-weight: 300;
}

@media (max-width: 600px) {
    #social-floating {
        right: 15px;
        bottom: 15px;
    }
}
</style>

<script>
const socialToggle = document.getElementById("social-toggle");
const socialFloating = document.getElementById("social-floating");
const socialIcon = document.getElementById("social-icon");

socialToggle.addEventListener("click", function() {
    socialFloating.classList.toggle("active");

    socialIcon.textContent =
        socialFloating.classList.contains("active") ? "×" : "+";
});
</script>


  


<div id="floating-like">
    <button id="like-button" aria-label="Lajkuj sajt">
        <span id="like-heart">♡</span>
        <span id="like-count">0</span>
    </button>
</div>

<style>
#floating-like {
    position: fixed;
    left: 25px;
    bottom: 95px;
    z-index: 99999;
}
#like-button {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 18px;
    border: none;
    border-radius: 50px;
    background: #244b36;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: 0.3s ease;
}

#like-heart {
    font-size: 25px;
    line-height: 1;
}

#like-button:hover {
    transform: translateY(-4px);
    background: #527b5d;
}

#like-button.liked {
    background: #527b5d;
}

#like-button.liked #like-heart {
    color: #ff6b81;
}


@media (max-width: 600px) {
    #floating-like {
        left: 15px;
        bottom: 85px;
    }
}
</style>

<script>
const likeButton = document.getElementById("like-button");
const likeHeart = document.getElementById("like-heart");
const likeCount = document.getElementById("like-count");

let liked = false;
let count = 0;

likeButton.addEventListener("click", function() {
    liked = !liked;

    if (liked) {
        count++;
        likeHeart.textContent = "♥";
        likeButton.classList.add("liked");
    } else {
        count--;
        likeHeart.textContent = "♡";
        likeButton.classList.remove("liked");
    }

    likeCount.textContent = count;
});
</script>
